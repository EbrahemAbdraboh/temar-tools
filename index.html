<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TEMAR TOOLS — Distribution Map Pilot</title>
<link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{--navy:#07305B;--orange:#F58112;--blue:#1267c4;--ink:#10253f;--muted:#6c7a8a;--bg:#f4f7fa;--card:#fff;--line:#e4eaf0;--green:#159447;--danger:#c83b3b}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit} button{cursor:pointer;border:0} .app{min-height:100vh}
header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 12px #07305b10}
.logo{height:44px;width:44px;object-fit:contain;border-radius:10px} .brand{font-weight:900;color:var(--navy);letter-spacing:.04em;margin-inline-start:auto} .header-actions{display:flex;gap:8px;align-items:center}
.btn{background:var(--navy);color:#fff;border-radius:11px;padding:10px 13px;font-weight:800;display:inline-flex;align-items:center;gap:8px} .btn.secondary{background:#edf3f8;color:var(--navy)} .btn.orange{background:var(--orange)} .btn:disabled{opacity:.45;cursor:not-allowed}
.lang{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:8px 11px;font-weight:800}
main{max-width:1500px;margin:auto;padding:18px} .grid{display:grid;grid-template-columns:360px 1fr;gap:16px} .panel,.map-wrap,.history{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #07305b0b}
.panel{padding:16px} h1{font-size:22px;margin:0 0 5px;color:var(--navy)} .sub{color:var(--muted);font-size:13px;margin-bottom:15px}
.branch{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:13px;margin:8px 0;background:#fff;transition:.2s} .branch:hover{border-color:#a9c8e8;box-shadow:0 5px 18px #1267c412} .branch input{width:18px;height:18px;accent-color:var(--navy)} .pin-mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eaf3ff;color:var(--blue)} .branch-name{font-weight:850} .meta{font-size:11px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px} .status{margin-top:12px;padding:11px;border-radius:12px;background:#f4f8fc;color:#42566d;font-size:13px;line-height:1.6}
.map-wrap{overflow:hidden;position:relative} #map{height:650px;min-height:520px} .map-badge{position:absolute;z-index:500;top:12px;right:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px;font-weight:800;box-shadow:0 4px 16px #0002}
.legend{position:absolute;z-index:500;bottom:12px;left:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;box-shadow:0 4px 16px #0002;font-size:12px} .legend div{display:flex;gap:8px;align-items:center;margin:5px 0} .legend .dot{width:20px;text-align:center}
.factory-marker{width:48px;height:48px;border-radius:50%;background:#fff;border:4px solid var(--navy);box-shadow:0 5px 16px #07305b44;display:grid;place-items:center;overflow:hidden} .factory-marker img{width:36px;height:36px;object-fit:contain}
.branch-marker{width:46px;height:56px;position:relative;filter:drop-shadow(0 4px 5px #0004);display:grid;place-items:center} .branch-marker i{font-size:46px;color:var(--blue);position:absolute;inset:0;line-height:56px;text-align:center} .branch-marker b{position:relative;color:#fff;font-size:14px;transform:translateY(-4px)}
.truck-marker{width:58px;height:46px;border-radius:14px;background:#fff;border:3px solid var(--orange);box-shadow:0 5px 16px #0003;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--navy);position:relative} .truck-marker .snow{position:absolute;right:-6px;top:-8px;background:var(--blue);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:2px solid #fff} .truck-marker i{font-size:27px}
.leaflet-popup-content-wrapper{border-radius:13px} .popup-title{font-weight:900;color:var(--navy);margin-bottom:5px} .popup-meta{font-size:12px;color:#637387}
.history{margin-top:16px;padding:16px} .history-head{display:flex;align-items:center;justify-content:space-between;gap:10px} .trip-card{margin-top:10px;padding:13px;border:1px solid var(--line);border-radius:13px;display:flex;justify-content:space-between;gap:10px;align-items:center} .trip-card strong{display:block} .trip-card small{color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:#00172b88;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px} .modal{background:#fff;border-radius:18px;max-width:430px;width:100%;padding:20px;box-shadow:0 20px 60px #0004} .modal h2{margin:0 0 8px;color:var(--navy);font-size:20px} .modal p{color:#5e6f80;line-height:1.7} .modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;z-index:4000;transition:.25s;font-size:13px} .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){header{height:62px;padding:0 12px}main{padding:10px}.grid{grid-template-columns:1fr}#map{height:55vh;min-height:440px}.panel{order:2}.map-wrap{order:1}.brand{font-size:13px}}
@media(max-width:520px){.actions{grid-template-columns:1fr} .header-actions .btn span{display:none} .btn{padding:9px 10px} .lang{padding:8px}}
</style></head>

let lang=localStorage.getItem('temar_lang')||'ar', map, markers={}, routeLayer=null, truckMarker=null, routeCoords=[], routeIndex=0, tripStart=null, tripArrivals=[], selected=[];
const T={ar:{home:'الرئيسية',title:'خريطة التوزيع',subtitle:'نسخة Pilot — المصنع + 3 فروع للاختبار',plan:'تحديد المسار',reset:'إعادة ضبط',gps:'تحديد موقعي',simulate:'محاكاة السيارة',history:'سجل الرحلات',historySub:'يتم حفظ رحلات الاختبار على هذا الجهاز.',clear:'مسح السجل',factoryLegend:'المصنع',branchLegend:'الفرع',truckLegend:'سيارة التوزيع',choose:'اختر فرعًا واحدًا على الأقل.',planned:'تم إعداد المسار المقترح.',gpsOk:'تم تحديد موقع السيارة من GPS.',gpsFail:'تعذر الحصول على الموقع. تأكد من صلاحية الموقع وHTTPS.',simStart:'بدأت محاكاة السيارة على المسار.',arrive:'تم الوصول إلى',arrivalAsk:'هل وصلت إلى الموقع؟',confirm:'تأكيد الوصول',cancel:'إلغاء',done:'اكتملت الرحلة وعادت السيارة إلى المصنع.',noHistory:'لا توجد رحلات مسجلة بعد.',historyClear:'تم مسح سجل الرحلات.',homeWarn:'العودة للرئيسية ستؤدي إلى إعادة ضبط حالة أداة خريطة التوزيع.',confirmHome:'العودة للرئيسية؟'},en:{home:'Home',title:'Distribution Map',subtitle:'Pilot — Factory + 3 test branches',plan:'Plan Route',reset:'Reset',gps:'Get My Location',simulate:'Simulate Vehicle',history:'Trip History',historySub:'Pilot trips are stored on this device.',clear:'Clear History',factoryLegend:'Factory',branchLegend:'Branch',truckLegend:'Delivery Vehicle',choose:'Select at least one branch.',planned:'Suggested route prepared.',gpsOk:'Vehicle location obtained from GPS.',gpsFail:'Could not get location. Check location permission and HTTPS.',simStart:'Vehicle simulation started.',arrive:'Arrived at',arrivalAsk:'Have you reached the location?',confirm:'Confirm Arrival',cancel:'Cancel',done:'Trip completed and vehicle returned to factory.',noHistory:'No trips recorded yet.',historyClear:'Trip history cleared.',homeWarn:'Going home will reset the Distribution Map tool state.',confirmHome:'Return Home?'}};
function tr(k){return T[lang][k]||k}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.getElementById('langBtn').textContent=lang==='ar'?'EN':'ع';renderBranches();renderHistory();updateStatus();}
function branchIcon(i){return L.divIcon({className:'',html:`<div class="branch-marker"><i class="fa-solid fa-location-dot"></i><b>${i+1}</b></div>`,iconSize:[46,56],iconAnchor:[23,54],popupAnchor:[0,-54]})}
function factoryIcon(){return L.divIcon({className:'',html:`<div class="factory-marker"><img src="${logo}" alt="TEMAR"></div>`,iconSize:[48,48],iconAnchor:[24,24]})}
function truckIcon(){return L.divIcon({className:'',html:`<div class="truck-marker"><i class="fa-solid fa-truck"></i><span class="snow"><i class="fa-solid fa-snowflake"></i></span></div>`,iconSize:[58,46],iconAnchor:[29,23]})}
function initMap(){map=L.map('map',{zoomControl:false}).setView([points.factory.lat,points.factory.lng],10);L.control.zoom({position:'topleft'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);markers.factory=L.marker([points.factory.lat,points.factory.lng],{icon:factoryIcon(),zIndexOffset:800}).addTo(map).bindPopup(`<div class="popup-title">${points.factory.nameAr}</div><div class="popup-meta">TEMAR • Start / End</div>`);points.branches.forEach((b,i)=>{markers[b.id]=L.marker([b.lat,b.lng],{icon:branchIcon(i),zIndexOffset:500}).addTo(map).bindPopup(`<div class="popup-title">${b.nameAr}</div><div class="popup-meta">Branch ${i+1}</div>`);});fitAll();}
function fitAll(){const ll=[L.latLng(points.factory.lat,points.factory.lng),...points.branches.map(b=>L.latLng(b.lat,b.lng))];map.fitBounds(L.latLngBounds(ll),{padding:[45,45]})}
function renderBranches(){const el=document.getElementById('branches');el.innerHTML='';points.branches.forEach(b=>{const checked=selected.includes(b.id);el.insertAdjacentHTML('beforeend',`<label class="branch"><input type="checkbox" data-id="${b.id}" ${checked?'checked':''}><span class="pin-mini"><i class="fa-solid fa-location-dot"></i></span><span><span class="branch-name">${lang==='ar'?b.nameAr:b.nameEn}</span><span class="meta">${b.lat.toFixed(5)}, ${b.lng.toFixed(5)}</span></span></label>`);});el.querySelectorAll('input').forEach(x=>x.addEventListener('change',()=>{selected=[...el.querySelectorAll('input:checked')].map(i=>i.dataset.id);updateStatus();}));}
function updateStatus(){document.getElementById('status').innerHTML=lang==='ar'?`تم اختيار <b>${selected.length}</b> من 3 فروع.${tripStart?'<br>الرحلة قيد التشغيل.':''}`:`<b>${selected.length}</b> of 3 branches selected.${tripStart?'<br>Trip in progress.':''}`}
function routeUrl(coords){return 'https://router.project-osrm.org/route/v1/driving/'+coords.map(p=>p.lng+','+p.lat).join(';')+'?overview=full&geometries=geojson&steps=true';}
async function planRoute(){if(!selected.length){toast(tr('choose'));return};clearRoute();const chosen=selected.map(id=>points.branches.find(b=>b.id===id));let order=[points.factory];let pool=[...chosen];let cur=points.factory;while(pool.length){pool.sort((a,b)=>dist(cur,a)-dist(cur,b));cur=pool.shift();order.push(cur)}order.push(points.factory);const res=await fetch(routeUrl(order));if(!res.ok){toast('Routing service unavailable');return}const data=await res.json();routeCoords=data.routes[0].geometry.coordinates.map(([lng,lat])=>[lat,lng]);routeLayer=L.geoJSON(data.routes[0].geometry,{style:{color:'#07305B',weight:6,opacity:.85}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});routeOrder=order;routeIndex=0;toast(tr('planned'));}
let routeOrder=[];
function dist(a,b){const R=6371, p=Math.PI/180, dLat=(b.lat-a.lat)*p,dLon=(b.lng-a.lng)*p;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function clearRoute(){if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}if(truckMarker){map.removeLayer(truckMarker);truckMarker=null}routeCoords=[];routeIndex=0;tripStart=null;tripArrivals=[];routeOrder=[]}
function resetAll(){selected=[];clearRoute();renderBranches();fitAll();updateStatus();toast(lang==='ar'?'تمت إعادة الضبط.':'Reset complete.')}
function startSim(){if(!routeCoords.length){toast(lang==='ar'?'حدد المسار أولًا.':'Plan the route first.');return};tripStart=new Date();tripArrivals=[];routeIndex=0;if(truckMarker)map.removeLayer(truckMarker);truckMarker=L.marker(routeCoords[0],{icon:truckIcon(),zIndexOffset:1500}).addTo(map);toast(tr('simStart'));stepVehicle();}
function stepVehicle(){if(!truckMarker||routeIndex>=routeCoords.length-1)return;routeIndex++;truckMarker.setLatLng(routeCoords[routeIndex]);const p=routeCoords[routeIndex];const current=routeOrder.find((x)=>Math.abs(x.lat-p[0])<0.004&&Math.abs(x.lng-p[1])<0.004);if(current&&current.id!=='factory'&&!tripArrivals.some(a=>a.id===current.id)){showArrival(current);}setTimeout(stepVehicle,120);}
function showArrival(branch){openModal(tr('confirmArrival'),`${tr('arrive')} <b>${lang==='ar'?branch.nameAr:branch.nameEn}</b> — ${tr('arrivalAsk')}`,()=>{tripArrivals.push({id:branch.id,time:new Date().toISOString()});checkDone();})}
function checkDone(){const needed=routeOrder.filter(x=>x.id!=='factory').length;if(tripArrivals.length===needed){setTimeout(()=>finishTrip(),500)}}
function finishTrip(){if(!tripStart)return;const end=new Date();const trip={date:end.toISOString(),start:tripStart.toISOString(),end:end.toISOString(),branches:routeOrder.filter(x=>x.id!=='factory').map(x=>x.id),arrivals:tripArrivals,distanceKm:routeOrder.reduce((s,x,i,a)=>i?s+dist(a[i-1],x):0,0)};const h=JSON.parse(localStorage.getItem('temar_trips')||'[]');h.unshift(trip);localStorage.setItem('temar_trips',JSON.stringify(h.slice(0,20)));renderHistory();toast(tr('done'));}
function renderHistory(){const el=document.getElementById('historyList'),h=JSON.parse(localStorage.getItem('temar_trips')||'[]');if(!h.length){el.innerHTML=`<div style="padding:18px 0;color:var(--muted)">${tr('noHistory')}</div>`;return}el.innerHTML=h.map((x,i)=>{const d=new Date(x.date);return `<div class="trip-card"><div><strong>${d.toLocaleDateString(lang==='ar'?'ar-EG':'en-GB',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'})}</strong><small>${x.branches.length} ${lang==='ar'?'فروع':'branches'} • ${x.distanceKm.toFixed(1)} km</small></div><button class="btn secondary" onclick="viewTrip(${i})"><i class="fa-solid fa-eye"></i></button></div>`}).join('')}
function viewTrip(i){const h=JSON.parse(localStorage.getItem('temar_trips')||'[]'),x=h[i];const names=x.branches.map(id=>{const b=points.branches.find(b=>b.id===id);return lang==='ar'?b.nameAr:b.nameEn}).join(' → ');openModal(lang==='ar'?'تفاصيل الرحلة':'Trip Details',`${names}<br><br>${lang==='ar'?'المسافة':'Distance'}: ${x.distanceKm.toFixed(1)} km<br>${lang==='ar'?'المدة':'Duration'}: ${Math.round((new Date(x.end)-new Date(x.start))/60000)} min`,()=>{});document.getElementById('modalCancel').textContent='OK';document.getElementById('modalOk').style.display='none';}
function openModal(title,text,ok){document.getElementById('modalTitle').innerHTML=title;document.getElementById('modalText').innerHTML=text;document.getElementById('modal').style.display='flex';document.getElementById('modalOk').style.display='inline-flex';document.getElementById('modalOk').textContent=tr('confirm');document.getElementById('modalCancel').textContent=tr('cancel');document.getElementById('modalOk').onclick=()=>{document.getElementById('modal').style.display='none';ok()};document.getElementById('modalCancel').onclick=()=>document.getElementById('modal').style.display='none'}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2600)}
document.getElementById('planBtn').onclick=planRoute;document.getElementById('resetBtn').onclick=resetAll;document.getElementById('simBtn').onclick=startSim;document.getElementById('clearHistory').onclick=()=>{localStorage.removeItem('temar_trips');renderHistory();toast(tr('historyClear'))};document.getElementById('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('temar_lang',lang);applyLang();};document.getElementById('gpsBtn').onclick=()=>{if(!navigator.geolocation){toast(tr('gpsFail'));return}navigator.geolocation.getCurrentPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude];if(truckMarker)truckMarker.setLatLng(p);else truckMarker=L.marker(p,{icon:truckIcon(),zIndexOffset:1500}).addTo(map);map.setView(p,14);toast(tr('gpsOk'));},()=>toast(tr('gpsFail')),{enableHighAccuracy:true,timeout:10000,maximumAge:5000})};document.getElementById('homeBtn').onclick=()=>openModal(tr('confirmHome'),tr('homeWarn'),()=>{resetAll();location.href='../../index.html'});
applyLang();initMap();
</script></body></html>
