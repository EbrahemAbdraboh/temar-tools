const RATES={1:3,2:1.5};
function calculateMix(requestedKg,grade,manualRate){
  const rate=grade==='manual'?manualRate:RATES[grade];
  const target=requestedKg*(1+rate/100);
  // TEMAR rule:
  // 1) 8 KG is always the base.
  // 2) Divide by 8 KG first.
  // 3) Distribute the remainder using 9 KG first, then one 8.5 KG carton at most.
  // 4) 8.5 KG is never repeated; there is at most one 8.5 KG carton.
  const eps=1e-9;
  let baseCartons=Math.floor(target/8);
  let remainder=target-(baseCartons*8);

  if(baseCartons<1){
    baseCartons=1;
    remainder=target-8;
  }

  // Normal case: the remainder can be distributed across the base cartons,
  // with no more than +1 KG per carton.
  let c8=baseCartons, c9=0, c85=0;

  if(remainder>eps && remainder<=baseCartons+eps){
    c9=Math.floor(remainder+eps);
    const fractional=remainder-c9;

    if(fractional>eps){
      if(Math.abs(fractional-0.5)<1e-7){
        c85=1;
      }else{
        // 9 KG has priority over adding another 8.5 KG carton.
        c9+=1;
      }
    }

    c8=baseCartons-c9-c85;
  }else if(remainder<=eps){
    c8=baseCartons;
  }else{
    // The base quotient cannot accommodate the remainder with +1 KG/carton.
    // Add the minimum number of base cartons needed to make the target fit.
    baseCartons=Math.ceil(target/9);
    c8=baseCartons;
    c9=0;
    c85=0;

    const capacity=c8*8;
    if(capacity+eps<target){
      const need=target-capacity;
      c9=Math.ceil(need-eps);
      // Keep at most one 8.5 KG carton; 9 KG has priority.
      c9=Math.min(c9,c8);
      c8=baseCartons-c9;

      // If a half-KG can replace one KG of required increase exactly,
      // use the single 8.5 KG carton only in that case.
      const remainingNeed=target-(c8*8+c9*9);
      if(remainingNeed>eps && remainingNeed<=0.5+eps && c9>0){
        c9-=1;
        c85=1;
        c8=baseCartons-c9-c85;
      }
    }
  }

  const packed=c8*8+c85*8.5+c9*9;
  const excess=packed-target;

  return {
    requestedKg,
    rate,
    bonusKg:target-requestedKg,
    targetKg:target,
    totalCartons:baseCartons,
    packedKg:packed,
    excessKg:excess,
    mix:[
      {weight:8,count:c8},
      {weight:9,count:c9},
      {weight:8.5,count:c85}
    ].filter(x=>x.count>0)
  };
}

function formView(){return `<form class="calculator-form" id="calcForm" novalidate><div class="field-group"><label for="quantity">${tr('required')}</label><div class="input-wrap"><input id="quantity" inputmode="decimal" type="number" min="0.5" step="0.5" placeholder="${tr('placeholder')}" aria-invalid="${!!error}"><span>${tr('kg')}</span></div>${error&&!error.includes(lang==='ar'?'البونص':'Bonus')?`<div class="error" role="alert">${error}</div>`:''}</div><div class="field-group"><span class="field-label">${tr('grade')}</span><div class="grade-grid" role="radiogroup"><button type="button" data-grade="1" class="grade-button ${grade===1?'active':''}"><strong>${tr('g1')}</strong><small>${tr('bonus')} 3%</small></button><button type="button" data-grade="2" class="grade-button ${grade===2?'active':''}"><strong>${tr('g2')}</strong><small>${tr('bonus')} 1.5%</small></button><button type="button" data-grade="manual" class="grade-button manual ${grade==='manual'?'active':''}"><strong>${tr('manual')}</strong><small>${tr('manualHint')}</small></button></div><div class="manual-field ${grade==='manual'?'':'hidden'}"><label for="manualRate">${tr('rate')}</label><div class="input-wrap manual-input-wrap"><input id="manualRate" inputmode="decimal" type="number" min="0" step="0.1" placeholder="${tr('ratePlaceholder')}" aria-label="${tr('manualRateAria')}"><span>%</span></div>${error&&error===tr('enterRate')?`<div class="error" role="alert">${error}</div>`:''}</div></div><button class="primary-button" type="submit">${tr('calculate')}</button></form>`}
function resultView(){return `<section class="result-section" aria-live="polite"><div class="result-head"><span class="result-kicker">${tr('success')}</span><h2>${result.totalCartons}</h2><p>${tr('total')}</p></div><div class="summary-grid"><div><span>${tr('requested')}</span><strong>${fmt(result.requestedKg)} ${tr('kg')}</strong></div><div><span>${tr('bonus')}</span><strong>${fmt(result.rate)}% · +${fmt(result.bonusKg)} ${tr('kg')}</strong></div><div><span>${tr('packed')}</span><strong>${fmt(result.packedKg)} ${tr('kg')}</strong></div></div><h3 class="mix-title">${tr('distribution')}</h3><div class="mix-grid">${result.mix.map(x=>`<article class="mix-card"><div class="mix-count">${x.count}</div><div class="mix-count-label">${tr('cartons')}</div>${carton(x.weight)}</article>`).join('')}</div><div class="result-note">${tr('note')}</div><button class="secondary-button" id="resetBtn" type="button">${tr('reset')}</button></section>`}
render();
