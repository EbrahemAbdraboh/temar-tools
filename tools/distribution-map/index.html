<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TEMAR TOOLS — Distribution Map Pilot</title>
<link rel="preconnect" href="https://unpkg.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="../../assets/fontawesome/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{--navy:#07305B;--orange:#F58112;--blue:#1267c4;--ink:#10253f;--muted:#6c7a8a;--bg:#f4f7fa;--card:#fff;--line:#e4eaf0;--green:#159447;--danger:#c83b3b}
*{box-sizing:border-box} body{margin:0;font-family:"Tajawal",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit} button{cursor:pointer;border:0} .app{min-height:100vh}
header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 12px #07305b10}
.logo{height:44px;width:44px;object-fit:contain;border-radius:10px} .brand{font-weight:900;color:var(--navy);letter-spacing:.04em;margin-inline-start:auto} .header-actions{display:flex;gap:8px;align-items:center}
.btn{background:var(--navy);color:#fff;border-radius:11px;padding:10px 13px;font-weight:800;display:inline-flex;align-items:center;gap:8px} .btn.secondary{background:#edf3f8;color:var(--navy)} .btn.orange{background:var(--orange)} .btn:disabled{opacity:.55;cursor:wait}.btn[data-busy="1"]{position:relative}.btn.route-active{box-shadow:0 0 0 3px #07305b22,0 7px 18px #07305b26}
.lang{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:8px 11px;font-weight:800}
main{max-width:1500px;margin:auto;padding:18px} .grid{display:grid;grid-template-columns:360px 1fr;gap:16px} .panel,.map-wrap,.history{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #07305b0b}
.panel{padding:16px} h1{font-size:22px;margin:0 0 5px;color:var(--navy)} .sub{color:var(--muted);font-size:13px;margin-bottom:15px}
.branch{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:13px;margin:8px 0;background:#fff;transition:.2s} .branch:hover{border-color:#a9c8e8;box-shadow:0 5px 18px #1267c412}.branch.editing{border-color:#1267c4;background:#f4f9ff;box-shadow:0 5px 18px #1267c412}.branch.editing input{transform:scale(1.12)} .branch input{width:18px;height:18px;accent-color:var(--navy)} .pin-mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eaf3ff;color:var(--blue)} .branch-name{font-weight:850} .meta{font-size:11px;color:var(--muted)} .trip-summary{margin-top:12px;padding:13px;border:1px solid #dce7f2;border-radius:14px;background:linear-gradient(180deg,#f9fbfd,#f2f7fb)} .trip-summary-title{font-weight:900;color:var(--navy);margin-bottom:10px}.trip-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.trip-stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px}.trip-stat strong{display:block;font-size:20px;color:var(--navy)}.trip-stat span{font-size:11px;color:var(--muted)} .edit-list{margin-top:9px;display:grid;gap:6px}.edit-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 9px}.edit-row span{font-weight:750;font-size:12px}.remove-branch{background:#fff0f0;color:var(--danger);border:1px solid #f2cccc;border-radius:8px;padding:6px 8px}.route-state{margin-top:8px;font-size:11px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px} .status{margin-top:12px;padding:11px;border-radius:12px;background:#f4f8fc;color:#42566d;font-size:13px;line-height:1.6}
.map-wrap{overflow:hidden;position:relative;min-height:520px} #map{height:650px;min-height:520px;width:100%;display:block} .map-badge{position:absolute;z-index:500;top:12px;right:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px;font-weight:800;box-shadow:0 4px 16px #0002}
.legend{position:absolute;z-index:500;bottom:12px;left:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;box-shadow:0 4px 16px #0002;font-size:12px} .legend div{display:flex;gap:8px;align-items:center;margin:5px 0} .legend .dot{width:20px;text-align:center}
.factory-marker{width:48px;height:48px;border-radius:50%;background:#fff;border:4px solid var(--navy);box-shadow:0 5px 16px #07305b44;display:grid;place-items:center;overflow:hidden} .factory-marker img{width:36px;height:36px;object-fit:contain}
.branch-marker{width:46px;height:56px;position:relative;filter:drop-shadow(0 4px 5px #0004);display:grid;place-items:center} .branch-marker i{font-size:46px;color:var(--blue);position:absolute;inset:0;line-height:56px;text-align:center} .branch-marker b{position:relative;color:#fff;font-size:14px;transform:translateY(-4px)}
.truck-marker{width:58px;height:46px;border-radius:14px;background:#fff;border:3px solid var(--orange);box-shadow:0 5px 16px #0003;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--navy);position:relative} .truck-marker .snow{position:absolute;right:-6px;top:-8px;background:var(--blue);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:2px solid #fff} .truck-marker i{font-size:27px}
.leaflet-popup-content-wrapper{border-radius:13px} .popup-title{font-weight:900;color:var(--navy);margin-bottom:5px} .popup-meta{font-size:12px;color:#637387}
.history{margin-top:16px;padding:16px} .history-head{display:flex;align-items:center;justify-content:space-between;gap:10px} .trip-card{margin-top:10px;padding:13px;border:1px solid var(--line);border-radius:13px;display:flex;justify-content:space-between;gap:10px;align-items:center} .trip-card strong{display:block} .trip-card small{color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:#00172b88;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px} .modal{background:#fff;border-radius:18px;max-width:430px;width:100%;padding:20px;box-shadow:0 20px 60px #0004} .modal h2{margin:0 0 8px;color:var(--navy);font-size:20px} .modal p{color:#5e6f80;line-height:1.7} .modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;z-index:4000;transition:.25s;font-size:13px} .toast.show{opacity:1;transform:translateX(-50%) translateY(0)} .permission-list{margin:10px 0 0;padding:0 20px;line-height:1.9;color:#4f6174;font-size:13px}.permission-state{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;background:#f4f8fc;margin-top:10px;font-size:12px;color:#42566d}.permission-state i{color:var(--blue)}
@media(max-width:900px){header{height:62px;padding:0 12px}main{padding:10px}.grid{grid-template-columns:1fr}#map{height:55vh;min-height:440px}.panel{order:2}.map-wrap{order:1}.brand{font-size:13px}}
@media(max-width:520px){.actions{grid-template-columns:1fr} .header-actions .btn span{display:none} .btn{padding:9px 10px} .lang{padding:8px}}
</style></head>

function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.getElementById('langBtn').textContent=lang==='ar'?'EN':'ع';renderBranches();renderHistory();renderTripSummary();updateStatus();}
function branchIcon(i){return L.divIcon({className:'',html:`<div class="branch-marker"><i class="fa-solid fa-location-dot"></i><b>${i+1}</b></div>`,iconSize:[46,56],iconAnchor:[23,54],popupAnchor:[0,-54]})}

function initMap(){map=L.map('map',{zoomControl:false}).setView([points.factory.lat,points.factory.lng],10);routeOverlayGroup=L.layerGroup().addTo(map);L.control.zoom({position:'topleft'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);markers.factory=L.marker([points.factory.lat,points.factory.lng],{icon:factoryIcon(),zIndexOffset:800}).addTo(map).bindPopup(`<div class="popup-title">${points.factory.nameAr}</div><div class="popup-meta">TEMAR • Start / End</div>`);syncSelectedBranchMarkers();fitAll()}
function syncSelectedBranchMarkers(){if(!map)return;points.branches.forEach((b,i)=>{const shouldShow=selected.includes(b.id);if(shouldShow&&!markers[b.id]){markers[b.id]=L.marker([b.lat,b.lng],{icon:branchIcon(i),zIndexOffset:500}).addTo(map).bindPopup(`<div class="popup-title">${b.nameAr}</div><div class="popup-meta">${lang==='ar'?'فرع مختار للرحلة':'Selected trip branch'}</div>`);}else if(!shouldShow&&markers[b.id]){map.removeLayer(markers[b.id]);delete markers[b.id];}})}
function fitAll(){const visible=points.branches.filter(b=>selected.includes(b.id));const ll=[L.latLng(points.factory.lat,points.factory.lng),...visible.map(b=>L.latLng(b.lat,b.lng))];map.fitBounds(L.latLngBounds(ll),{padding:[45,45],maxZoom:14})}
function renderBranches(){
 const el=document.getElementById('branches');
 el.innerHTML='';
 const locked=!!tripStart||routePhase==='return';
 const routeLocked=!!routeOrder.length&&!editMode;
 points.branches.forEach(b=>{
  const checked=selected.includes(b.id);
  el.insertAdjacentHTML('beforeend',`<label class="branch ${editMode?'editing':''}">
   <input type="checkbox" data-id="${b.id}" ${checked?'checked':''} ${(locked||routeLocked)?'disabled':''}>

   <span><span class="branch-name">${lang==='ar'?b.nameAr:b.nameEn}</span><span class="meta">${editMode&&!locked?(lang==='ar'?'اضغط لإضافة أو إزالة الفرع':'Tap to add or remove'):''}</span></span>
  </label>`);
 });

  if(!editMode && routeOrder.length){x.checked=selected.includes(x.dataset.id);return}
  selected=[...el.querySelectorAll('input:checked')].map(i=>i.dataset.id);
  syncSelectedBranchMarkers();fitAll();updateStatus();
 }));
}
function updateStatus(){const el=document.getElementById('status');if(locationWatchId!==null){el.innerHTML=`<i class="fa-solid fa-location-dot"></i> ${tr('statusGps')}`;return}if(tripStart){el.innerHTML=lang==='ar'?`الرحلة قيد التشغيل — تم تأكيد <b>${tripArrivals.length}</b> من <b>${routeOrder.filter(x=>x.id!=='factory').length}</b> فروع.`:`Trip in progress — <b>${tripArrivals.length}</b> of <b>${routeOrder.filter(x=>x.id!=='factory').length}</b> branches confirmed.`;return}el.innerHTML=lang==='ar'?`تم اختيار <b>${selected.length}</b> من 3 فروع.`:`<b>${selected.length}</b> of 3 branches selected.`}
function renderTripSummary(){
 const el=document.getElementById('tripSummary');
 if(!routeOrder.length){el.innerHTML='';editMode=false;renderBranches();return}
 const branches=routeOrder.filter(x=>x.id!=='factory');
 const d=(totalTripDistanceKm||0).toFixed(1);
 const locked=!!tripStart||routePhase==='return';
 el.innerHTML=`<div class="trip-summary"><div class="trip-summary-title">${tr('routeReady')}</div><div class="trip-stats"><div class="trip-stat"><strong>${branches.length}</strong><span>${tr('branchesCount')}</span></div><div class="trip-stat"><strong>${d} <small>${tr('km')}</small></strong><span>${tr('totalDistance')}</span></div></div><div class="route-state">${routePhase==='outbound'?tr('routeOutbound'):routePhase==='return'?tr('returnShown'):tr('statusPlanned')}</div>${!locked?`<div class="actions" style="margin-top:10px"><button type="button" class="btn secondary" id="editTripBtn"><i class="fa-solid ${editMode?'fa-check':'fa-pen-to-square'}"></i><span>${editMode?tr('applyEdit'):tr('edit')}</span></button></div>`:''}</div>`;

}
async function handleEditTrip(){
 const btn=document.getElementById('editTripBtn');
 if(!btn)return;
 if(tripStart||routePhase==='return'){toast(tr('editLocked'));return}
 if(!editMode){
  editMode=true;
  renderBranches();

  // its own click event can cause the confirmation action to fire immediately.
  const icon=btn.querySelector('i');

  if(icon)icon.className='fa-solid fa-check';
  if(label)label.textContent=tr('applyEdit');

  btn.classList.add('orange');

 }
 if(!selected.length){toast(tr('choose'));return}

}
function handlePlanClick(){

  const planBtn=document.getElementById('planBtn');

const ROUTING_ENGINES=[
 'https://routing.openstreetmap.de/routed-car/route/v1/driving/',
 'https://router.project-osrm.org/route/v1/driving/'
];
async function fetchWithTimeout(url,ms=12000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{method:'GET',headers:{'Accept':'application/json'},mode:'cors',signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.code!=='Ok'||!d.routes?.[0])throw new Error(d.message||d.code||'routing');return d}finally{clearTimeout(t)}}
async function getRoute(coords){let lastErr=null;const path=coords.map(p=>encodeURIComponent(p.lng+','+p.lat)).join(';');for(const base of ROUTING_ENGINES){try{const d=await fetchWithTimeout(base+path+'?overview=full&geometries=geojson&steps=false');return {geometry:d.routes[0].geometry,distanceKm:d.routes[0].distance/1000,durationMin:d.routes[0].duration/60,engine:base.includes('openstreetmap.de')?'OSM Router':'OSRM Demo'};}catch(e){lastErr=e}}throw lastErr||new Error('routing')}
function clearLayers(){if(routeOverlayGroup)routeOverlayGroup.clearLayers();if(routeLayer){map.removeLayer(routeLayer)}if(returnLayer){map.removeLayer(returnLayer)}if(truckMarker){map.removeLayer(truckMarker)}routeLayer=null;returnLayer=null;truckMarker=null}
function startNewRouteSession(){
  tripSessionId++;
  clearLayers();
  routeCoords=[];
  routeIndex=0;
  tripArrivals=[];
  routeOrder=[];
  routePhase='none';
  outboundDistanceKm=0;
  returnDistanceKm=0;
  totalTripDistanceKm=0;
  waitingForArrival=false;
  arrivalPrompted=false;
  stopIndexes=[];
  lastKnownPosition=null;
}
async function planRoute(options={}){
 const newSession=options.newSession===true;
 if(tripStart){toast(tr('editLocked'));return}
 if(!selected.length){toast(tr('choose'));return}

 // Any re-plan after an edit starts a brand-new route session. The old
 // route is removed BEFORE any routing request so it can never be drawn
 // underneath the new route.

 // This also handles the user pressing "تحديد المسار" directly after changing
 // the branch checkboxes instead of pressing "تطبيق التعديل".
 const currentRouteIds=routeOrder.filter(x=>x.id!=='factory').map(x=>x.id);
 const selectedRouteChanged=currentRouteIds.length!==selected.length ||
   currentRouteIds.some(id=>!selected.includes(id));
 const requiresNewSession=newSession || editMode || selectedRouteChanged;

 if(requiresNewSession){
  startNewRouteSession();
  editMode=false;
  renderBranches();
  renderTripSummary();
  updateStatus();
 }
 const session=tripSessionId;
 const btn=document.getElementById('planBtn');
 if(btn){
  btn.disabled=true;
  btn.dataset.busy='1';
  btn.classList.add('route-active');
  const label=btn.querySelector('span');
  if(label)label.textContent=lang==='ar'?'جارٍ حساب المسار…':'Calculating route…';
 }

 const previousRoute=routeLayer;
 const previousReturn=returnLayer;
 const previousOrder=routeOrder;
 const previousCoords=routeCoords;
 const previousOutbound=outboundDistanceKm;
 const previousReturnDistance=returnDistanceKm;
 const previousTotal=totalTripDistanceKm;
 const previousPhase=routePhase;

 try{
  const chosen=selected.map(id=>points.branches.find(b=>b.id===id)).filter(Boolean);
  if(!chosen.length)throw new Error(tr('choose'));

  // Build the stop order without changing the currently displayed route.
  let order=[points.factory],pool=[...chosen],cur=points.factory;
  while(pool.length){
   pool.sort((a,b)=>dist(cur,a)-dist(cur,b));
   cur=pool.shift();
   order.push(cur);
  }

  // Calculate the complete data first. The map is updated only after all
  // required calculations succeed, so a transient API/UI error cannot
  // remove a route that was already drawn.
  const out=await getRoute(order);
  if(session!==tripSessionId)return;
  const nextRouteCoords=(out.geometry?.coordinates||[]).map(([lng,lat])=>[lat,lng]);
  if(!nextRouteCoords.length)throw new Error('Empty route geometry');

  let nextReturnDistance=0;
  const last=order[order.length-1];
  try{
   const ret=await getRoute([last,points.factory]);
   if(session!==tripSessionId)return;
   nextReturnDistance=ret.distanceKm;
  }catch(returnErr){
   nextReturnDistance=dist(last,points.factory);
  }

  const nextOutboundDistance=out.distanceKm;
  const nextTotalDistance=nextOutboundDistance+nextReturnDistance;

  const nextStopIndexes=[];
  let cursor=0;
  order.filter(x=>x.id!=='factory').forEach(branch=>{
   let best=cursor,bestD=Infinity;
   for(let i=cursor;i<nextRouteCoords.length;i++){
    const d=distPoint(branch,nextRouteCoords[i]);
    if(d<bestD){bestD=d;best=i}
   }
   nextStopIndexes.push({id:branch.id,index:best});
   cursor=best;
  });

  const nextLayer=L.geoJSON(out.geometry,{
   style:{color:'#07305B',weight:6,opacity:.88}
  }).addTo(map);

  // Commit the new route state atomically.
  if(session!==tripSessionId){map.removeLayer(nextLayer);return;}
  if(previousRoute&&previousRoute!==nextLayer)map.removeLayer(previousRoute);
  if(previousReturn)map.removeLayer(previousReturn);
  routeLayer=nextLayer;
  returnLayer=null;
  routeOrder=order;
  routeCoords=nextRouteCoords;
  stopIndexes=nextStopIndexes;
  outboundDistanceKm=nextOutboundDistance;
  returnDistanceKm=nextReturnDistance;
  totalTripDistanceKm=nextTotalDistance;
  tripArrivals=[];
  routePhase='outbound';
  routeIndex=0;
  arrivalPrompted=false;
  waitingForArrival=false;

  const bounds=routeLayer.getBounds();
  if(bounds&&bounds.isValid())map.fitBounds(bounds,{padding:[40,40]});
  renderTripSummary();
  renderBranches();
  updateStatus();
  toast(tr('planned'));
 }catch(e){
  // If this was a fresh edit session, the old route was intentionally
  // cleared before calculation. Do not restore it after a routing error.
  if(!requiresNewSession){
   routeLayer=previousRoute;
   returnLayer=previousReturn;
   routeOrder=previousOrder;
   routeCoords=previousCoords;
   outboundDistanceKm=previousOutbound;
   returnDistanceKm=previousReturnDistance;
   totalTripDistanceKm=previousTotal;
   routePhase=previousPhase;
  }
  console.error('planRoute failed:',e);
  toast((tr('routingFail'))+' '+(e?.message||''));
 }finally{
  if(btn&&session===tripSessionId){
   btn.disabled=false;
   btn.dataset.busy='';
   btn.classList.toggle('route-active',!!routeLayer&&routePhase==='outbound');
   const label=btn.querySelector('span');
   if(label)label.textContent=tr('plan');
  }
 }
}
function dist(a,b){const R=6371,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lng-a.lng)*p,x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
let tripSessionId=0;
let homeConfirmPending=false;
function resetAll(){
 stopLocationWatch();
 homeConfirmPending=false;
 tripSessionId++;
 editMode=false;
 selected=[];
 clearLayers();
 routeCoords=[];
 routeIndex=0;
 tripStart=null;
 tripArrivals=[];
 routeOrder=[];
 routePhase='none';
 outboundDistanceKm=0;
 returnDistanceKm=0;
 totalTripDistanceKm=0;
 waitingForArrival=false;
 arrivalPrompted=false;
 stopIndexes=[];
 lastKnownPosition=null;
 if(document.getElementById('planBtn')){
  document.getElementById('planBtn').disabled=false;
  document.getElementById('planBtn').dataset.busy='';
  document.getElementById('planBtn').classList.remove('route-active');
 }
 syncSelectedBranchMarkers();
 renderBranches();
 renderTripSummary();
 updateStatus();
 if(map)fitAll();
 toast(lang==='ar'?'تمت إعادة الضبط.':'Reset complete.');
}
async function applyBranchEdit(nextSelected){
 if(tripStart||routePhase==='return'){toast(tr('editLocked'));return}
 const normalized=[...new Set(nextSelected)].filter(id=>points.branches.some(b=>b.id===id));
 if(!normalized.length){toast(tr('choose'));return}
 selected=normalized;
 editMode=false;
 syncSelectedBranchMarkers();
 renderBranches();
 renderTripSummary();
 updateStatus();
 await planRoute({newSession:true});
 if(routeOrder.length)toast(tr('updated'));
}
function startSim(){if(!routeCoords.length||routePhase!=='outbound'){toast(lang==='ar'?'حدد مسار الذهاب أولًا.':'Plan the outbound route first.');return}if(tripStart){return}tripStart=new Date();tripArrivals=[];routeIndex=0;waitingForArrival=false;if(truckMarker)map.removeLayer(truckMarker);truckMarker=L.marker(routeCoords[0],{icon:truckIcon(),zIndexOffset:1500}).addTo(routeOverlayGroup);updateStatus();toast(tr('simStart'));stepVehicle()}
function stepVehicle(){if(homeConfirmPending||!truckMarker||routeIndex>=routeCoords.length-1||waitingForArrival)return;routeIndex++;truckMarker.setLatLng(routeCoords[routeIndex]);const next=routeOrder.find(x=>x.id!=='factory'&&!tripArrivals.some(a=>a.id===x.id));const stop=next?stopIndexes.find(s=>s.id===next.id):null;if(next&&stop&&routeIndex>=stop.index&&!arrivalPrompted){arrivalPrompted=true;waitingForArrival=true;showArrival(next);return}setTimeout(stepVehicle,80)}
function distPoint(point,latlng){return dist(point,{lat:latlng[0],lng:latlng[1]})}
function showArrival(branch){if(homeConfirmPending)return;openModal(tr('confirm'),`${tr('arrive')} <b>${lang==='ar'?branch.nameAr:branch.nameEn}</b><br>${tr('arrivalAsk')}`,()=>{if(tripArrivals.some(a=>a.id===branch.id))return;tripArrivals.push({id:branch.id,time:new Date().toISOString()});arrivalPrompted=false;waitingForArrival=false;updateStatus();renderTripSummary();if(tripArrivals.length===routeOrder.filter(x=>x.id!=='factory').length){finishTrip();return}setTimeout(stepVehicle,100)})}
function checkDone(){const needed=routeOrder.filter(x=>x.id!=='factory').length;if(tripArrivals.length===needed)setTimeout(()=>finishTrip(),300)}
async function finishTrip(){
 if(!tripStart||routePhase!=='outbound')return;
 const session=tripSessionId;
 const tripStartedAt=tripStart;
 const last=routeOrder[routeOrder.length-1]||points.factory;
 try{
  const ret=await getRoute([last,points.factory]);
  if(session!==tripSessionId||tripStart!==tripStartedAt||routePhase!=='outbound')return;
  returnDistanceKm=ret.distanceKm;
  totalTripDistanceKm=outboundDistanceKm+returnDistanceKm;
  if(returnLayer)map.removeLayer(returnLayer);
  returnLayer=L.geoJSON(ret.geometry,{style:{color:'#F58112',weight:6,opacity:.92,dashArray:'10 8'}}).addTo(routeOverlayGroup);
  routePhase='return';
  if(truckMarker)truckMarker.setLatLng([points.factory.lat,points.factory.lng]);
  map.fitBounds(L.featureGroup([routeLayer,returnLayer]).getBounds(),{padding:[40,40]});
  renderTripSummary();
  const end=new Date();
  const trip={date:end.toISOString(),start:tripStartedAt.toISOString(),end:end.toISOString(),branches:routeOrder.filter(x=>x.id!=='factory').map(x=>x.id),arrivals:tripArrivals,distanceKm:totalTripDistanceKm,outboundDistanceKm,returnDistanceKm};
  const h=JSON.parse(localStorage.getItem('temar_trips')||'[]');
  h.unshift(trip);localStorage.setItem('temar_trips',JSON.stringify(h.slice(0,20)));
  renderHistory();updateStatus();toast(tr('done'));
 }catch(e){
  if(session===tripSessionId)toast(tr('routingFail'));
 }
}
function renderHistory(){const el=document.getElementById('historyList'),h=JSON.parse(localStorage.getItem('temar_trips')||'[]');if(!h.length){el.innerHTML=`<div style="padding:18px 0;color:var(--muted)">${tr('noHistory')}</div>`;return}el.innerHTML=h.map((x,i)=>{const d=new Date(x.date);return `<div class="trip-card"><div><strong>${d.toLocaleDateString(lang==='ar'?'ar-EG':'en-GB',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'})}</strong><small>${x.branches.length} ${tr('branches')} • ${Number(x.distanceKm).toFixed(1)} km</small></div><button class="btn secondary" data-view-trip="${i}"><i class="fa-solid fa-eye"></i></button></div>`}).join('');el.querySelectorAll('[data-view-trip]').forEach(b=>b.onclick=()=>viewTrip(Number(b.dataset.viewTrip)))}
function viewTrip(i){const h=JSON.parse(localStorage.getItem('temar_trips')||'[]'),x=h[i];if(!x)return;const names=x.branches.map(id=>{const b=points.branches.find(b=>b.id===id);return b?(lang==='ar'?b.nameAr:b.nameEn):id}).join(' → ');openModal(tr('historyDetails'),`${names}<br><br>${tr('distance')}: ${Number(x.distanceKm).toFixed(1)} km<br>${tr('duration')}: ${Math.round((new Date(x.end)-new Date(x.start))/60000)} min`,null,{hideOk:true,okText:tr('close'),cancelText:tr('close')})}
function openModal(title,text,ok,opts={}){const modal=document.getElementById('modal'),titleEl=document.getElementById('modalTitle'),textEl=document.getElementById('modalText'),okBtn=document.getElementById('modalOk'),cancelBtn=document.getElementById('modalCancel');titleEl.textContent=title;textEl.innerHTML=text||'';modal.style.display='flex';okBtn.style.display=opts.hideOk?'none':'inline-flex';okBtn.textContent=opts.okText||tr('confirm');cancelBtn.textContent=opts.cancelText||tr('cancel');cancelBtn.style.display='inline-flex';okBtn.onclick=null;cancelBtn.onclick=null;okBtn.onclick=()=>{modal.style.display='none';if(typeof ok==='function')ok()};cancelBtn.onclick=()=>{modal.style.display='none';if(typeof opts.onCancel==='function')opts.onCancel()}}
function requestLocationPermission(){openModal(tr('permissionTitle'),`${tr('permissionText')}<ul class="permission-list"><li>${tr('permissionSteps')}</li><li>${tr('secureRequired')}</li></ul><div class="permission-state"><i class="fa-solid fa-shield-halved"></i><span>${tr('locationStatus')}</span></div>`,()=>startLiveLocation(),{okText:tr('permissionContinue'),cancelText:tr('permissionCancel')})}
async function startLiveLocation(){if(!window.isSecureContext&&!['localhost','127.0.0.1'].includes(location.hostname)){toast(tr('secureRequired'));return}if(!navigator.geolocation){toast(tr('gpsFail'));return}try{if(navigator.permissions&&navigator.permissions.query){const perm=await navigator.permissions.query({name:'geolocation'});if(perm.state==='denied'){openModal(tr('permissionDeniedTitle'),tr('permissionDeniedText'),null,{hideOk:true,okText:tr('close'),cancelText:tr('close')});return}if(perm.state==='prompt')toast(tr('permissionPrompt'));}stopLocationWatch();locationWatchId=navigator.geolocation.watchPosition(onLocationSuccess,onLocationError,{enableHighAccuracy:true,timeout:15000,maximumAge:3000});updateStatus()}catch(e){toast(tr('gpsFail'))}}
function onLocationSuccess(pos){lastKnownPosition=pos;const p=[pos.coords.latitude,pos.coords.longitude];if(truckMarker)truckMarker.setLatLng(p);else truckMarker=L.marker(p,{icon:truckIcon(),zIndexOffset:1500}).addTo(routeOverlayGroup);if(tripStart&&routePhase==='outbound'&&!waitingForArrival){const next=routeOrder.find(x=>x.id!=='factory'&&!tripArrivals.some(a=>a.id===x.id));if(next&&distPoint(next,p)<0.25&&!arrivalPrompted){arrivalPrompted=true;waitingForArrival=true;showArrival(next)}}toast(tr('gpsOk'));updateStatus()}
function onLocationError(err){stopLocationWatch();if(err&&err.code===1){toast(tr('gpsDenied'))}else if(err&&err.code===2){toast(tr('gpsUnavailable'))}else{toast(tr('gpsFail'))}updateStatus()}
function stopLocationWatch(){if(locationWatchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(locationWatchId)}locationWatchId=null}
function clearHistory(){openModal(tr('clear'),tr('clearConfirm'),()=>{localStorage.removeItem('temar_trips');renderHistory();toast(tr('historyClear'))})}
function homeNavigation(){homeConfirmPending=true;openModal(tr('confirmHome'),tr('homeWarn'),()=>{homeConfirmPending=false;resetAll();const home=document.body.dataset.home||'../../index.html';window.location.href=new URL(home,window.location.href).href;},{onCancel:()=>{homeConfirmPending=false}});}
document.getElementById('planBtn').onclick=handlePlanClick;
document.getElementById('resetBtn').onclick=resetAll;
document.getElementById('simBtn').onclick=startSim;
document.getElementById('clearHistory').onclick=clearHistory;
document.getElementById('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('temar_lang',lang);applyLang()};
document.getElementById('gpsBtn').onclick=requestLocationPermission;
window.planRoute=planRoute;window.homeNavigation=homeNavigation;window.resetAll=resetAll;
window.addEventListener('error',e=>{const msg=e?.error?.message||e?.message||'JavaScript error';console.error(e.error||e);updateStatus();toast((lang==='ar'?'خطأ في الأداة: ':'Tool error: ')+msg);});
window.addEventListener('unhandledrejection',e=>{const msg=e?.reason?.message||String(e?.reason||'Unhandled error');console.error(e.reason);toast((lang==='ar'?'تعذر تنفيذ العملية: ':'Operation failed: ')+msg);});
applyLang();initMap();
